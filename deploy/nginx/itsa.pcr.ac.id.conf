# Nginx untuk Website ITSA — itsa.pcr.ac.id
#
# Template acuan, BUKAN berkas yang langsung dipakai apa adanya. Salin ke
# server lalu sesuaikan:
#
#   sudo cp deploy/nginx/itsa.pcr.ac.id.conf /etc/nginx/sites-available/itsa
#   sudo ln -s /etc/nginx/sites-available/itsa /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Certbot akan menambahkan sendiri baris sertifikat saat dijalankan; tidak
# perlu menuliskannya manual. Lihat README bagian Deploy.
#
# ============================================================================
# PENANDA DI BAWAH INI PENTING DIBACA
#
#   [WAJIB]   — tanpa baris ini ada yang RUSAK atau TIDAK AMAN
#   [OPSIONAL]— peningkatan; aman dihilangkan kalau menyulitkan
# ============================================================================


# ----------------------------------------------------------------------------
# LAPIS UTAMA PEMBATASAN LAJU
#
# [WAJIB] Blok ini harus berada di konteks `http`, BUKAN di dalam `server`.
# Kalau berkas ini di-include dari dalam blok http (bawaan Debian/Ubuntu lewat
# sites-enabled), letaknya sudah benar. Kalau tidak, pindahkan dua baris
# limit_req_zone ini ke /etc/nginx/nginx.conf di dalam blok http.
#
# Ini lapis UTAMA, dan sengaja terpisah dari pembatasan laju di aplikasi.
# Alasannya: hanya di sini alamat IP asli benar-benar diketahui.
# $binary_remote_addr adalah alamat sumber koneksi TCP — tidak bisa dikarang
# pengirim, berbeda dari header HTTP apa pun.
#
# Pembatasan di aplikasi (5 kiriman / 10 menit) tetap ada sebagai lapis kedua,
# tapi ia bergantung pada header yang dikirim Nginx. Kalau lapis ini dilewat,
# aplikasi hanya sekuat kejujuran pengirimnya.
# ----------------------------------------------------------------------------

# 30 permintaan/menit per alamat IP untuk endpoint pengiriman aspirasi.
limit_req_zone $binary_remote_addr zone=aspirasi:10m rate=30r/m;

# [OPSIONAL] Perlindungan tambahan untuk halaman login admin, menahan tebakan
# kata sandi beruntun. Payload sendiri sudah mengunci akun setelah 5 percobaan
# gagal selama 10 menit, jadi ini lapis ekstra, bukan pengganti.
limit_req_zone $binary_remote_addr zone=admin_login:10m rate=10r/m;


# ----------------------------------------------------------------------------
# HTTP → HTTPS
#
# [WAJIB] Situs harus dilayani lewat HTTPS. Cookie sesi admin diberi flag
# Secure di produksi, dan peramban MENOLAK menyimpan cookie Secure pada
# koneksi HTTP polos — akibatnya login admin gagal tanpa pesan error apa pun.
# ----------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name itsa.pcr.ac.id;

    # Certbot menaruh berkas verifikasinya di sini saat memperbarui sertifikat.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}


server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name itsa.pcr.ac.id;

    # ------------------------------------------------------------------------
    # [WAJIB] Sertifikat. Baris di bawah ini biasanya DITULIS SENDIRI oleh
    # certbot saat menjalankan:
    #
    #   sudo certbot --nginx -d itsa.pcr.ac.id
    #
    # Kalau certbot yang mengurus, biarkan saja — jangan menduplikasi.
    # ------------------------------------------------------------------------
    # ssl_certificate     /etc/letsencrypt/live/itsa.pcr.ac.id/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/itsa.pcr.ac.id/privkey.pem;
    # include             /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # [OPSIONAL] HSTS — memberitahu peramban agar tidak pernah lagi mencoba
    # HTTP untuk domain ini. Menutup celah waktu pada permintaan pertama.
    # JANGAN dipasang sebelum HTTPS terbukti jalan: kalau sertifikatnya
    # bermasalah setelah HSTS aktif, peramban menolak membuka situs sama
    # sekali, dan efeknya bertahan selama max-age.
    add_header Strict-Transport-Security "max-age=31536000" always;

    # [OPSIONAL] Header pengerasan lain.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # [OPSIONAL] Unggahan media dari panel admin bisa besar. Bawaan Nginx
    # 1 MB, terlalu kecil untuk foto pengurus beresolusi tinggi.
    client_max_body_size 25M;

    # ------------------------------------------------------------------------
    # Endpoint pengiriman aspirasi — satu-satunya jalur tulis anonim.
    # [OPSIONAL] tapi sangat disarankan: inilah lapis utama pembatasan laju.
    # burst=5 memberi kelonggaran untuk lonjakan wajar; nodelay melayani
    # lonjakan itu segera alih-alih mengantrekannya.
    # ------------------------------------------------------------------------
    location /next/aspirasi {
        limit_req zone=aspirasi burst=5 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # [WAJIB] lihat penjelasan di blok location / di bawah.
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header Host               $host;
        proxy_set_header X-Forwarded-Proto  $scheme;
    }

    # [OPSIONAL] Pembatasan laju halaman login admin.
    location = /admin/login {
        limit_req zone=admin_login burst=5 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header Host               $host;
        proxy_set_header X-Forwarded-Proto  $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # ====================================================================
        # [WAJIB] BARIS INI YANG MEMBUAT TRUSTED_IP_HEADER=x-real-ip AMAN
        # ====================================================================
        #
        # `proxy_set_header X-Real-IP $remote_addr` MENIMPA header X-Real-IP
        # apa pun yang dikirim pengunjung, menggantinya dengan alamat sumber
        # koneksi yang sebenarnya. Karena ditimpa, nilainya tidak bisa
        # dikarang — dan itulah satu-satunya alasan aplikasi boleh
        # mempercayainya.
        #
        # Tanpa baris ini, JANGAN mengisi TRUSTED_IP_HEADER di .env server.
        # Aplikasi akan memercayai header kiriman pengunjung, dan pembatasan
        # lajunya bisa dilewati cukup dengan mengganti-ganti nilainya di tiap
        # permintaan.
        #
        # Cara memastikannya benar setelah deploy: jalankan smoke test di
        # README bagian Deploy. Kiriman keenam HARUS mendapat 429.
        proxy_set_header X-Real-IP          $remote_addr;

        # [WAJIB] Tanpa Host yang benar, pengalihan dan tautan absolut yang
        # dihasilkan aplikasi menunjuk ke localhost.
        proxy_set_header Host               $host;

        # [WAJIB] Memberitahu aplikasi bahwa pengunjung memakai HTTPS meski
        # sambungan ke Node berjalan lewat HTTP di dalam server.
        proxy_set_header X-Forwarded-Proto  $scheme;

        # [OPSIONAL] Diperlukan kalau kelak ada fitur yang memakai WebSocket.
        proxy_set_header Upgrade            $http_upgrade;
        proxy_set_header Connection         'upgrade';

        # [OPSIONAL] Panel admin bisa lambat saat memproses unggahan besar.
        proxy_read_timeout 120s;
    }
}

# ============================================================================
# CATATAN KALAU ADA CLOUDFLARE ATAU CDN DI DEPAN NGINX
#
# Dengan CDN, $remote_addr berisi alamat server edge CDN — bukan pengunjung.
# Akibatnya seluruh pengunjung menumpuk di segelintir alamat, dan pembatasan
# laju jadi salah sasaran.
#
# Perbaikannya, di konteks http:
#
#   set_real_ip_from 173.245.48.0/20;   # lengkapi seluruh rentang CDN
#   set_real_ip_from 103.21.244.0/22;
#   real_ip_header   CF-Connecting-IP;
#
# Setelah itu $remote_addr sudah berisi alamat pengunjung sungguhan, sehingga
# `proxy_set_header X-Real-IP $remote_addr` di atas tetap benar dan
# TRUSTED_IP_HEADER=x-real-ip tetap dipakai — tidak ada yang perlu diubah di
# aplikasi.
#
# [WAJIB kalau memakai CDN] Batasi juga siapa yang boleh menyentuh origin,
# supaya orang tidak bisa melewati CDN dan mengarang header sendiri:
#
#   allow 173.245.48.0/20;
#   allow 103.21.244.0/22;
#   deny all;
#
# Daftar rentang Cloudflare: https://www.cloudflare.com/ips/
# ============================================================================
